name: Release

# Runs only when a maintainer pushes a version tag, e.g. v1.1.1.
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release
  id-token: write      # sign the build provenance
  attestations: write  # store the build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # The C library fixes for OpenSSL 3 are on linkja-crypto develop only.
      - uses: actions/checkout@v7
        with:
          repository: MRAIA-ORG/linkja-crypto
          ref: develop
          path: linkja-crypto

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install OpenSSL 3 and CMake
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake

      # The tests call only Library.hash, so the public build is enough.
      - name: Compile the public build of the C library
        working-directory: linkja-crypto
        run: |
          cmake . -DINCLUDE_SECRETS=OFF -DCMAKE_BUILD_TYPE=Release
          make linkjacrypto

      - name: Test and package linkja-hashing
        run: mvn -B verify -Dnative.lib.dir="$GITHUB_WORKSPACE/linkja-crypto/target"

      # The jar name holds the pom version. So this step fails when the tag and the pom version differ.
      - name: Write SHA256SUMS
        working-directory: target
        run: |
          jar=$(ls -- *-"${TAG#v}"-jar-with-dependencies.jar)
          sha256sum "$jar" > SHA256SUMS
          echo "JAR=target/$jar" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.JAR }}

      # The release notes start with the tag message. Name each security fix there.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          msg=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")
          gh release create "$TAG" "$JAR" target/SHA256SUMS --generate-notes --notes "$msg

          Security fixes: the tag message above names each change in this release that fixes a security problem. If it names none, this release has no security fix."
